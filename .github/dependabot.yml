# Dependency updates (#44).
#
# Version updates wait out a 14-day cooldown: brand-new releases are where
# compromised packages tend to appear, so nothing is proposed until it has
# been public for two weeks. Security updates are raised regardless.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (our type-aware lint) supports TypeScript only up to 6.0,
      # so TypeScript 7.x can't be installed alongside it yet (#106, #144); later majors still come.
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    groups:
      # vitest and its plugins must be the same version: a major moves them together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: [major]
      # Batch tooling (lint/format/test/build) into one PR; runtime deps stay separate.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
