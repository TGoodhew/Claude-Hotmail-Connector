name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies end up in the shipped .mcpb bundle: fail on any
      # high/critical advisory there. (Dev-only tooling is tracked separately.)
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Control-character check
        run: npm run check:text

      - name: Build
        run: npm run build

      # Fails if coverage drops below the thresholds in vitest.config.ts (#47).
      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build Claude Desktop extension (.mcpb)
        run: npm run build:mcpb
