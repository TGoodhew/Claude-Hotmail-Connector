name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 LTS (#45). The oldest supported runtime is tested below.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies end up in the shipped .mcpb bundle: fail on any
      # high/critical advisory there. (Dev-only tooling is tracked separately.)
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Control-character check
        run: npm run check:text

      - name: Build
        run: npm run build

      # Fails if coverage drops below the thresholds in vitest.config.ts (#47).
      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Build Claude Desktop extension (.mcpb)
        run: npm run build:mcpb

  # The .mcpb declares package.json engines.node (Node 22.12+) as its minimum,
  # and source checkouts need it too. Keep that claim true: build and test on
  # exactly that version as well (#148). Claude Desktop itself runs extensions on
  # its own bundled Node, 24.22 as of Claude Desktop 3.6556.1.
  minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (oldest supported)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Windows is the primary target, and the real DPAPI key-protection tests only
  # run there (#46).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
