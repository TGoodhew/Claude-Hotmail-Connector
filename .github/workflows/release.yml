name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.0); must match package.json"
        required: true

permissions:
  contents: write
  # Build provenance attestation for the .mcpb (#46).
  id-token: write
  attestations: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: a release installs fresh from the lockfile, so a
          # poisoned cache can't reach a signed, provenance-attested build (#129).
          # setup-node 5+ would otherwise cache automatically in some setups.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package.json version ($expected)." >&2
            exit 1
          fi

      - name: Audit, typecheck, lint, format, control characters
        run: |
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run lint
          npm run format:check
          npm run check:text

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Build Claude Desktop extension (.mcpb)
        run: npm run build:mcpb

      - name: Checksums
        run: |
          cd build
          sha256sum hotmail-connector.mcpb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed SLSA provenance: anyone can check the bundle was built here, from
      # this tag, with `gh attestation verify hotmail-connector.mcpb --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/hotmail-connector.mcpb

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Claude Desktop extension for $TAG: download hotmail-connector.mcpb and double-click it (or drag it into Claude Desktop > Settings > Extensions), then enter your own Entra app's Application (client) ID. Verify against SHA256SUMS.txt, or check its build provenance with: gh attestation verify hotmail-connector.mcpb --repo $GITHUB_REPOSITORY. See the README for creating your app registration and for Claude Code (source) setup."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" build/hotmail-connector.mcpb build/SHA256SUMS.txt --clobber
