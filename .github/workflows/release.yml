name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.0); must match package.json"
        required: true

permissions:
  contents: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match package.json version ($expected)." >&2
            exit 1
          fi

      - name: Audit, typecheck, lint, format, control characters
        run: |
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run lint
          npm run format:check
          npm run check:text

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Build Claude Desktop extension (.mcpb)
        run: npm run build:mcpb

      - name: Checksums
        run: |
          cd build
          sha256sum hotmail-connector.mcpb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Claude Desktop extension for $TAG: download hotmail-connector.mcpb and double-click it (or drag it into Claude Desktop > Settings > Extensions), then enter your own Entra app's Application (client) ID. Verify against SHA256SUMS.txt. See the README for creating your app registration and for Claude Code (source) setup."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" build/hotmail-connector.mcpb build/SHA256SUMS.txt --clobber
